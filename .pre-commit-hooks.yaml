# NuFi pre-commit hooks — 이 파일을 통해 외부 프로젝트에서
# pre-commit 프레임워크로 NuFi PII 스캔을 사용할 수 있습니다.
#
# 사용법 (.pre-commit-config.yaml):
#   repos:
#     - repo: https://github.com/dudaji/nufi-security
#       rev: v0.4.18
#       hooks:
#         - id: nufi-scan
#         - id: nufi-scan-strict  # 또는 strict 모드

- id: nufi-scan
  name: NuFi PII scan (staged files)
  entry: nufi-egress scan --git-staged --fail-on-pii
  language: python
  types: [text]
  stages: [pre-commit]
  require_serial: true

- id: nufi-scan-strict
  name: NuFi PII + injection scan (strict)
  entry: nufi-egress scan --git-staged --fail-on-pii --profile strict
  language: python
  types: [text]
  stages: [pre-commit]
  require_serial: true
