# PII 라우팅 설정 (CMP-271).
# 운영자가 코드 수정 없이 PII 라우팅 동작을 제어할 수 있다.
# PiiRouter 초기화 시 이 파일을 읽어 파라미터를 결정한다.

# PII 라우팅 활성화 여부
enabled: true

# PII 감지 시 요청을 보낼 로컬 모델명 (LiteLLM model_list의 model_name)
local_model: nufi-local

# PII 미감지 시 허용할 클라우드 모델명
cloud_model: nufi-cloud

# 감지 오류 시 로컬 모델로 안전 폴백 (true = fail-closed)
fail_closed: true

# 로컬 강제 대상 엔티티 타입 목록.
# null 이면 모든 PII 엔티티가 로컬 라우팅 대상.
# 특정 엔티티만 지정하면 해당 엔티티 감지 시에만 로컬 라우팅.
# 예: [KR_RRN, SECRET, CREDIT_CARD]
force_local_entities: null
